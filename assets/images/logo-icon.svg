<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Pavana V Logo">
  <defs>
    <!-- Background: Deep Executive Obsidian with Ambient Violet Core -->
    <radialGradient id="pv-bg" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#241548" />
      <stop offset="55%" stop-color="#120A24" />
      <stop offset="100%" stop-color="#080410" />
    </radialGradient>

    <!-- Hairline Rim Stroke -->
    <linearGradient id="pv-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(233, 213, 255, 0.65)" />
      <stop offset="45%" stop-color="rgba(168, 85, 247, 0.35)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.15)" />
    </linearGradient>

    <!-- Monogram P Stroke (Pure White to Orchid Lavender) -->
    <linearGradient id="pv-p-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Monogram V Stroke (Electric Violet to Royal Purple) -->
    <linearGradient id="pv-v-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="35%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="pv-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5.5" flood-color="#7C3AED" flood-opacity="0.35" />
    </filter>

    <!-- Vertex Micro Glow -->
    <filter id="pv-vertex-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Luxury Finish -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pv-bg)" filter="url(#pv-shadow)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="url(#pv-rim)" stroke-width="1.2" />

  <!-- Subtle Specular Corner Sheen -->
  <path d="M7 17C7 11.4772 11.4772 7 17 7H47" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" stroke-linecap="round" />

  <!-- Monogram Glyph: Architectural Precision P + V -->
  <!-- Pillar Stem of P -->
  <rect x="17.5" y="14.5" width="5.2" height="35" rx="2.6" fill="url(#pv-p-stroke)" />

  <!-- Geometric Upper Loop of P -->
  <path d="M20 17.1H32.8C38.4333 17.1 43 21.6667 43 27.3C43 32.9333 38.4333 37.5 32.8 37.5H20.5" 
        stroke="url(#pv-p-stroke)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Interlocking Dynamic Chevron V -->
  <path d="M27.5 34.5L38.4 47.8C39.2 48.78 40.7 48.78 41.5 47.8L50.5 36" 
        stroke="url(#pv-v-stroke)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Luminous Engineering Vertex Accent -->
  <circle cx="39.95" cy="48" r="1.5" fill="#FFFFFF" filter="url(#pv-vertex-glow)" />
</svg>
